services:
  hellomate:
    container_name: hellomate-bot
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Optional local PostgreSQL. Enable with: docker compose --profile postgres up -d
  # Then set in .env: DATABASE_URL=postgresql+psycopg://hellomate:hellomate@postgres:5432/hellomate
  # In the recommended topology the DB lives on a separate private server, so leave
  # this profile disabled on the public bot host and point DATABASE_URL at the remote.
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    container_name: hellomate-postgres
    environment:
      POSTGRES_DB: hellomate
      POSTGRES_USER: hellomate
      POSTGRES_PASSWORD: hellomate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: hellomate-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
